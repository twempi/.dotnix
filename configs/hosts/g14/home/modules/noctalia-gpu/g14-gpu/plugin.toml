id = "edward/g14-gpu"
name = "G14 GPU Switcher"
version = "1.0.0"
plugin_api = 13
author = "Edward"
license = "MIT"
dependencies = ["supergfxctl"]
tags = ["gpu", "panel", "g14"]
icon = "device-desktop-cog"
description = "Switch Zephyrus G14 GPU modes with supergfxctl."

[[panel]]
id = "switcher"
entry = "panel.luau"
width = 420
height = 330
placement = "floating"
position = "center"
open_near_click = false
keyboard_focus = "exclusive"
capture_keys = ["Up", "Down", "Return"]
