[notification]
background_opacity = 1.0

[osd]
background_opacity = 1.0

[shell]
corner_radius_scale = 0.5000000074505806
font_family = "Iosevka"
launch_apps_as_systemd_services = true
settings_show_advanced = true

    [shell.animation]
    speed = 3.0

    [shell.launcher]
    categories = false
    compact = true
    fetch_exchange_rates = false
    layout = "simple"
    search_position = "top"

        [shell.launcher.providers.calculator]
        global = false

    [shell.panel]
    control_center_placement = "floating"
    session_placement = "floating"
    session_position = "center"
    wallpaper_placement = "floating"
    wallpaper_position = "center"

    [shell.screenshot]
    directory = "/home/edward/Pictures/Screenshots"
    filename_pattern = "Screenshot-%Y-%m-%d_%H:%M:%S"

    [[shell.session.actions]]
    action = "lock"
    enabled = true
    shortcut = "l"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    enabled = true
    variant = "default"

    [[shell.session.actions]]
    action = "suspend"
    enabled = true
    shortcut = "s"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    enabled = true
    shortcut = "r"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    enabled = true
    shortcut = "p"
    variant = "destructive"

[theme]
custom_palette = "stylix"
mode = "dark"
source = "custom"

    [theme.templates]
    enable_builtin_templates = false
    enable_community_templates = false

[wallpaper]
directory = "/home/edward/Pictures/wallpapers"

    [wallpaper.default]
    path = "/home/edward/Pictures/wallpapers/9.png"

    [wallpaper.last]
    path = "/home/edward/Pictures/wallpapers/9.png"

    [wallpaper.monitors.DP-1]
    path = "/home/edward/Pictures/wallpapers/9.png"

[weather]
unit = "imperial"

# Resolved from the active Stylix palette by the Home Manager module.
[widget.battery]
capsule = false
color = "@base0B@"
display_mode = "glyph"
show_label = true
warning_color = "error"

[widget.bluetooth]
show_label = true

[widget.brightness]
capsule = false
color = "@base0A@"
show_label = true

    [widget.brightness.actions]
    scroll_down = "brightness-down current 5%"
    scroll_up = "brightness-up current 5%"

[widget.clock]
capsule = false
color = "@base0A@"
format = "{:%a %d | %I:%M %p}"

[widget.control-center]
glyph = "confucius"

[widget.cpu]
capsule = false
color = "@base09@"
glyph = "cpu"
show_glyph = true
show_value = true
stat = "cpu_usage"
type = "sysmon"
visualization = "none"

[widget.disk]
capsule = false
color = "@base08@"
glyph = "server"
path = "/"
show_glyph = true
show_value = true
stat = "disk_used_pct"
type = "sysmon"
visualization = "none"

[widget.network]
capsule = false
color = "@base0E@"
glyph = "download"
show_glyph = true
show_value = true
stat = "net_rx"
type = "sysmon"
visualization = "none"

[widget.notifications]
capsule = false
color = "@base0E@"
hide_when_no_unread = true

[widget.ram]
capsule = false
color = "@base0C@"
glyph = "memory"
show_glyph = true
show_tooltip = false
show_value = true
stat = "ram_used"
type = "sysmon"
visualization = "none"

[widget.tray]
hidden = [ "blueman", "nm-applet", "pasystray" ]

[widget.volume]
capsule = false
color = "@base0D@"
device = "output"
mute_color = "error"
show_label = true
type = "volume"

    [widget.volume.actions]
    scroll_down = "volume-down 5%"
    scroll_up = "volume-up 5%"

[widget.workspaces]
active_pill_size = 1.3
capsule = false
capsule_radius = 0.0
empty_color = "outline"
focused_color = "primary"
font_scale = 1.0
hide_when_empty = false
inactive_pill_size = 1.0
label_source = "id"
labels_only_when_occupied = false
max_label_chars = 2
occupied_color = "secondary"
pill_scale = 1.0
scale = 1.05
show_labels = true
style = "regular"
type = "workspaces"
