[bar.default]
background_opacity = 1.0
border_width = 0
capsule = true
capsule_fill = "surface_variant"
capsule_foreground = "on_surface_variant"
capsule_opacity = 1.0
capsule_radius = 4.0
center = []
end = [ "tray", "network", "disk", "cpu", "brightness", "ram", "volume", "battery", "clock", "notifications" ]
font_family = "IosevkaTerm Nerd Font Propo"
font_weight = 900
margin_edge = 0
margin_ends = 0
padding = 6
radius = 0
shadow = false
start = [ "workspaces" ]
thickness = 24
widget_spacing = 10

[calendar]
enabled = true

    [calendar.account.personal_google]
    type = "google"

[desktop_widgets]
enabled = false

[dock]
background_opacity = 1.0

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [
    "lockscreen-login-box@HDMI-A-2",
    "lockscreen-login-box@DP-4",
    "lockscreen-login-box@HDMI-A-1",
    "lockscreen-login-box@DP-2",
    "lockscreen-login-box@DP-1"
