[notification]
background_opacity = 1.0

[osd]
background_opacity = 1.0

[shell]
corner_radius_scale = 0.5000000074505806
font_family = "Iosevka"
launch_apps_as_systemd_services = true
settings_show_advanced = true

    [shell.animation]
    speed = 3.0

    [shell.launcher]
    categories = false
    compact = true
    fetch_exchange_rates = false
    layout = "simple"

        [shell.launcher.providers.calculator]
        global = false

    [shell.panel]
    control_center_placement = "floating"
    session_placement = "centered"
    wallpaper_placement = "centered"

    [shell.screenshot]
    directory = "/home/edward/Pictures/Screenshots"
    filename_pattern = "Screenshot-%Y-%m-%d_%H:%M:%S"

    [[shell.session.actions]]
    action = "lock"
    enabled = true
    shortcut = "l"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    enabled = true
    variant = "default"

    [[shell.session.actions]]
    action = "suspend"
    enabled = true
    shortcut = "s"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    enabled = true
    shortcut = "r"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    enabled = true
    shortcut = "p"
    variant = "destructive"

[theme]
custom_palette = "stylix"
mode = "dark"
source = "custom"

    [theme.templates]
    enable_builtin_templates = false
    enable_community_templates = false

[wallpaper]
directory = "/home/edward/Pictures/wallpapers"

    [wallpaper.default]
    path = "/home/edward/Pictures/wallpapers/39.png"

    [wallpaper.last]
    path = "/home/edward/Pictures/wallpapers/39.png"

    [wallpaper.monitors.DP-1]
    path = "/home/edward/Pictures/wallpapers/19.png"

    [wallpaper.monitors.DP-2]
    path = "/home/edward/Pictures/wallpapers/24.png"

    [wallpaper.monitors.DP-4]
    path = "/home/edward/Pictures/wallpapers/39.png"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/edward/Pictures/wallpapers/19.png"

    [wallpaper.monitors.HDMI-A-2]
    path = "/home/edward/Pictures/wallpapers/39.png"

[weather]
unit = "imperial"

[widget.bluetooth]
show_label = true

[widget.bongocat]
script = "scripts/bongocat.lua"
type = "scripted"

[widget.control-center]
enabled = false
glyph = "confucius"

[widget.network]
show_label = false

[widget.notifications]
hide_when_no_unread = true

[widget.tray]
hidden = [ "blueman", "nm-applet", "pasystray" ]

[widget.workspaces]
active_pill_size = 2.0
capsule = false
font_scale = 1.1000000000000001
hide_when_empty = true
minimal = true
scale = 1.0
