[bar.default]
background_opacity = 1.0
border_width = 2.0
capsule_opacity = 1.0
center = [ "clock", "date" ]
end = [ "tray", "bluetooth", "network", "volume", "brightness", "battery", "control-center", "notifications" ]
font_weight = 400
margin_edge = 4
margin_ends = 4
radius = 0
start = [ "workspaces" ]

[calendar]
enabled = true

    [calendar.account.personal_google]
    type = "google"

[desktop_widgets]
enabled = false

[dock]
background_opacity = 1.0

[location]
auto_locate = true

